<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#241917">
<title>Control · Inteligencia Emocional</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Control remoto de la presentación: estado arriba, botones grandes al pulgar abajo */
:root{--ink:#241917;--ink2:#35262390;--paper:#F4EFEA;--red:#B8141F;--pink:#F08A8F;--muted:#B9A9A4;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);display:flex;flex-direction:column;gap:14px;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.top{display:flex;justify-content:space-between;align-items:center;font:700 12px var(--body);letter-spacing:.18em;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:8px;vertical-align:middle}
.on .dot{background:#5fcf7a}
.now{min-height:120px}
.sec{font:700 13px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--c,var(--pink))}
h1{font:700 26px/1.2 var(--display);margin:8px 0 4px;text-wrap:balance}
.num{font:600 15px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:#ffffff1f;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:none;border:1.5px solid var(--c);background:transparent;color:var(--paper);font:600 14px var(--body);padding:9px 14px;border-radius:999px}
.chips button.cur{background:var(--c)}
.pad{flex:1;display:grid;grid-template-rows:1fr auto;gap:12px;min-height:260px}
.btn{border:0;border-radius:18px;font:800 22px var(--display);letter-spacing:.04em;touch-action:manipulation}
.btn:active{transform:scale(.98);filter:brightness(1.15)}
.next{background:var(--red);color:#fff;font-size:30px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prev,.cd{background:#ffffff14;color:var(--paper);padding:22px 0}
.cd{font-size:16px}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#app:not([hidden]){display:contents}
.join[hidden]{display:none}
.join{display:flex;flex-direction:column;gap:12px;margin:auto 0}
.join input{font:600 18px var(--body);padding:14px;border-radius:10px;border:1px solid #ffffff33;background:#ffffff10;color:var(--paper)}
.join .btn{background:var(--red);color:#fff;padding:16px}
</style>
<body>
<div class="top" id="top"><span><span class="dot"></span><span id="st">Conectando…</span></span><span>CONTROL REMOTO</span></div>

<form class="join" id="join" hidden>
  <h1>Escribe la clave de la presentación</h1>
  <input id="key" autocomplete="off" autocapitalize="off" placeholder="Ej.: iepabc123">
  <button class="btn" type="submit">Conectar</button>
</form>

<main id="app" hidden>
  <div class="now"><div class="sec" id="sec">—</div><h1 id="title">Esperando a la presentación…</h1><div class="num" id="num"></div></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="chips" id="chips"></div>
  <div class="pad">
    <button class="btn next" id="next" type="button">SIGUIENTE ›</button>
    <div class="row"><button class="btn prev" id="prev" type="button">‹ ATRÁS</button><button class="btn cd" id="cd" type="button">⏱ CUENTA 5:00</button></div>
  </div>
</main>

<script>
const NT='https://ntfy.sh/';
let K=new URLSearchParams(location.search).get('k'),secs=[],state=null;
const $=id=>document.getElementById(id);
if(!K){$('join').hidden=false;$('st').textContent='Sin clave'}
$('join').onsubmit=e=>{e.preventDefault();const v=$('key').value.trim();if(v)location.search='?k='+encodeURIComponent(v)};

function send(m){
  fetch(NT+K,{method:'POST',body:m}).catch(()=>{$('st').textContent='Sin conexión'});
  if(navigator.vibrate)navigator.vibrate(15);
}
function render(){
  if(!state)return;
  const s=secs[state.s]||{};
  $('sec').textContent=s.n||'';$('sec').style.setProperty('--c',s.c||'');
  $('title').textContent=state.t||'(lámina con imagen)';
  $('num').textContent='Lámina '+(state.i+1)+' de '+state.n;
  $('prog').style.width=((state.i+1)/state.n*100)+'%';
  [...$('chips').children].forEach((b,k)=>{b.classList.toggle('cur',k==state.s);if(k==state.s)b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})});
}
if(K){
  $('app').hidden=false;
  const es=new EventSource(NT+K+'-s/sse');
  es.onopen=()=>{$('top').classList.add('on');$('st').textContent='Conectado';send('ping')};
  es.onerror=()=>{$('top').classList.remove('on');$('st').textContent='Reconectando…'};
  es.onmessage=e=>{
    let d;try{d=JSON.parse(JSON.parse(e.data).message)}catch(x){return}
    if(d.secs){secs=d.secs;$('chips').innerHTML='';secs.forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s.n;b.style.setProperty('--c',s.c);b.onclick=()=>send('go:'+s.f);$('chips').append(b)})}
    state=d;render();
  };
  $('next').onclick=()=>send('next');
  $('prev').onclick=()=>send('prev');
  $('cd').onclick=()=>send('cd');
}
</script>
</body>
</html>
